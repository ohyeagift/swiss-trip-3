<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>瑞士之旅</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDYbRZaCAmgMB3Si3R0m9B6f3kabPGvyMU&libraries=marker&callback=initMap" async defer></script>
</head>
<body>
    <!-- 觀看密碼專屬畫面 (預設隱藏 ，由 JS 控制) -->
    <div id="password-overlay" class="password-overlay">
        <div class="pwd-box">
            <h2>🔒 私密行程</h2>
            <p>請輸入觀看密碼  
<small>(提示：出發日期)</small></p>
            <input type="password" id="view-pwd-input" placeholder="請輸入密碼">
            <button onclick="verifyViewPassword()">進入</button>
        </div>
    </div>

    <!-- 頂部全局資訊區 -->
    <header class="top-header">
        <div class="header-content">
            <div>
                <div class="trip-title">瑞士之旅</div>
                <div class="trip-dates">2026.10.16 - 10.27</div>
            </div>
            <button class="edit-day-btn" onclick="checkPasswordAndOpen()">編輯行程</button>
        </div>
        <div class="day-title" id="day-title">載入中...</div>
    </header>

    <!-- 互動地圖區 -->
    <div class="map-container">
        <div id="map"></div>
    </div>

    <!-- 橫向滑動導航列 -->
    <div class="tabs-container" id="tabs-container"></div>

    <!-- 每日行程時間軸 -->
    <div class="timeline-container" id="timeline-container"></div>

    <!-- ================= 彈出視窗區 ================= -->
    
    <!-- 1. 編輯行程列表 Modal -->
    <div id="list-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <button class="close-btn" onclick="closeListModal()">✕</button>
                <h3 id="modal-day-title">編輯行程</h3>
                <div style="width: 24px;"></div>
            </div>
            <div class="modal-body">
                <div class="sort-hint">新增行程會依時間自動排序</div>
                <div id="edit-list-container">
                    <!-- JS 動態生成列表 -->
                </div>
                <button class="btn-secondary add-btn" onclick="openNewFormModal()">+ 新增行程</button>
            </div>
            <div class="modal-footer double-btn">
                <button class="btn-secondary" onclick="exportData()">匯出資料</button>
                <button class="btn-primary" onclick="closeListModal()">完成</button>
            </div>
        </div>
    </div>

    <!-- 2. 編輯單一活動 Modal -->
    <div id="form-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <button class="close-btn" onclick="closeFormModal()">✕</button>
                <h3>編輯行程活動</h3>
                <div style="width: 24px;"></div>
            </div>
            <div class="modal-body form-body">
                <div class="form-group">
                    <label>時間</label>
                    <input type="text" id="edit-time" placeholder="例如: 07:30 或 上午">
                </div>
                <div class="form-group">
                    <label>名稱</label>
                    <input type="text" id="edit-name" placeholder="例如: Pilatus 皮拉圖斯峰">
                </div>
                <div class="form-group">
                    <label>內容 (如: 海拔/備註 - 可按 Enter 換行)</label>
                    <textarea id="edit-content" rows="3" placeholder="例如: 海拔 2,128m&#10;放低行李"></textarea>
                </div>
                <div class="form-group">
                    <label>地圖 (搜尋關鍵字 - 用於按鈕連結)</label>
                    <input type="text" id="edit-map" placeholder="例如: Pilatus">
                </div>
                <div class="form-group" style="display: flex; gap: 10px;">
                    <div style="flex: 1;">
                        <label>緯度 Lat (選填 - 用於地圖標記)</label>
                        <input type="number" id="edit-lat" step="any" placeholder="如: 47.0501">
                    </div>
                    <div style="flex: 1;">
                        <label>經度 Lng (選填 - 用於地圖標記)</label>
                        <input type="number" id="edit-lng" step="any" placeholder="如: 8.3093">
                    </div>
                </div>
                <div class="form-group">
                    <label>官網連結</label>
                    <input type="text" id="edit-website" placeholder="https://...">
                </div>
                <div class="form-group">
                    <label>攝影機連結</label>
                    <input type="text" id="edit-webcam" placeholder="https://...">
                </div>
                <div class="form-group">
                    <label>天氣連結</label>
                    <input type="text" id="edit-weather" placeholder="https://...">
                </div>
                <div class="form-group">
                    <label>其他連結</label>
                    <input type="text" id="edit-other" placeholder="https://...">
                </div>
            </div>
            <div class="modal-footer double-btn">
                <button class="btn-secondary" onclick="closeFormModal( )">取消</button>
                <button class="btn-primary" onclick="saveActivity()">完成</button>
            </div>
        </div>
    </div>

    <!-- 3. 編輯住宿 Modal -->
    <div id="acc-form-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <button class="close-btn" onclick="closeAccFormModal()">✕</button>
                <h3>編輯住宿資訊</h3>
                <div style="width: 24px;"></div>
            </div>
            <div class="modal-body form-body">
                <div class="form-group">
                    <label>住宿名稱</label>
                    <input type="text" id="edit-acc-name">
                </div>
                <div class="form-group">
                    <label>地圖 (搜尋關鍵字)</label>
                    <input type="text" id="edit-acc-map">
                </div>
                <div class="form-group" style="display: flex; gap: 10px;">
                    <div style="flex: 1;">
                        <label>緯度 Lat</label>
                        <input type="number" id="edit-acc-lat" step="any">
                    </div>
                    <div style="flex: 1;">
                        <label>經度 Lng</label>
                        <input type="number" id="edit-acc-lng" step="any">
                    </div>
                </div>
                <div class="form-group">
                    <label>官網連結</label>
                    <input type="text" id="edit-acc-website" placeholder="https://...">
                </div>
                <div class="form-group">
                    <label>其他連結</label>
                    <input type="text" id="edit-acc-other" placeholder="https://...">
                </div>
            </div>
            <div class="modal-footer double-btn">
                <button class="btn-secondary" onclick="closeAccFormModal( )">取消</button>
                <button class="btn-primary" onclick="saveAccommodation()">完成</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
